<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1E35">
  <title>Credentials - OptiLens Local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/optilens.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* ─── Credentials page styles ─────────────────────────── */
    .creds-wrap { max-width: 800px; margin: 0 auto; padding: 24px 20px 48px; }

    /* Lock screen */
    .lock-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 20px; text-align: center;
    }
    .lock-icon {
      font-size: 48px; line-height: 1;
      background: var(--surface); border-radius: 50%;
      width: 88px; height: 88px; display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--line); box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    .lock-title { font-size: 1.4rem; font-weight: 700; color: var(--ink); margin: 0; }
    .lock-sub   { color: var(--muted); margin: 0; font-size: .9rem; max-width: 340px; }

    .pin-form    { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 320px; }
    .pin-input-row { display: flex; gap: 8px; width: 100%; }
    .pin-input   {
      flex: 1; padding: 10px 14px; border: 1.5px solid var(--line);
      border-radius: 10px; background: var(--surface); color: var(--ink);
      font-family: inherit; font-size: 1rem; letter-spacing: .12em;
      transition: border-color .15s;
    }
    .pin-input:focus { outline: none; border-color: var(--blue); }
    .pin-input.error { border-color: var(--red); animation: shake .3s; }
    .pin-btn {
      padding: 10px 22px; background: var(--blue); color: #fff;
      border: none; border-radius: 10px; font-family: inherit; font-size: .9rem;
      font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: background .15s, opacity .15s;
    }
    .pin-btn:hover { background: var(--blue-dark); }
    .pin-btn:disabled { opacity: .5; cursor: default; }
    .pin-err { color: var(--red); font-size: .85rem; min-height: 1.2em; }
    .pin-hint { color: var(--muted); font-size: .8rem; }

    /* Unlocked vault */
    .vault-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px; padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .vault-status {
      display: flex; align-items: center; gap: 6px;
      background: var(--badge-ok-bg); color: #065f46;
      padding: 4px 12px; border-radius: 20px; font-size: .8rem; font-weight: 600;
    }
    :root[data-theme="dark"] .vault-status { background: rgba(40,167,187,.18); color: #5de8f5; }
    .vault-status::before { content: ""; display: block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .lock-btn {
      margin-left: auto; padding: 6px 16px; border-radius: 9px;
      border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
      font-family: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .lock-btn:hover { border-color: var(--blue); background: var(--bg-elevated); }

    /* Category tabs */
    .cred-tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
    .cred-tab {
      padding: 6px 14px; border: 1.5px solid var(--line); border-radius: 8px;
      background: var(--surface); color: var(--muted); font-family: inherit;
      font-size: .82rem; font-weight: 600; cursor: pointer;
      transition: all .15s;
    }
    .cred-tab.active  { background: var(--blue); color: #fff; border-color: var(--blue); }
    .cred-tab:hover:not(.active) { border-color: var(--blue); color: var(--blue); }

    /* Credential entries */
    .cred-list { display: flex; flex-direction: column; gap: 10px; }
    .cred-entry {
      background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
      overflow: hidden; transition: border-color .15s;
    }
    .cred-entry:focus-within { border-color: var(--blue); }
    .cred-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; cursor: pointer; user-select: none;
    }
    .cred-type-badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      background: var(--badge-default-bg); color: var(--muted);
    }
    .cred-name { font-weight: 600; font-size: .9rem; color: var(--ink); flex: 1; }
    .cred-chevron { color: var(--muted); transition: transform .2s; font-size: .85rem; }
    .cred-entry.open .cred-chevron { transform: rotate(90deg); }
    .cred-body { display: none; padding: 0 14px 14px; }
    .cred-entry.open .cred-body { display: block; }

    .field-row {
      display: grid; grid-template-columns: 140px 1fr auto; gap: 8px;
      align-items: center; margin-bottom: 8px;
    }
    .field-label { font-size: .78rem; font-weight: 600; color: var(--muted); }
    .field-val-wrap { position: relative; }
    .field-val {
      width: 100%; padding: 7px 36px 7px 10px; border-radius: 8px;
      border: 1.5px solid var(--line); background: var(--bg-elevated);
      color: var(--ink); font-family: 'Courier New', monospace; font-size: .85rem;
      box-sizing: border-box;
    }
    .field-val:focus { outline: none; border-color: var(--blue); }
    .reveal-btn {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--muted);
      font-size: .85rem; padding: 4px; line-height: 1;
    }
    .reveal-btn:hover { color: var(--blue); }
    .field-actions { display: flex; gap: 4px; }
    .del-field-btn {
      background: none; border: none; cursor: pointer; color: var(--muted);
      font-size: .85rem; padding: 4px; line-height: 1; border-radius: 6px;
    }
    .del-field-btn:hover { color: var(--red); background: rgba(214,48,49,.08); }

    .cred-actions {
      display: flex; gap: 8px; margin-top: 10px;
      padding-top: 10px; border-top: 1px solid var(--line);
    }
    .add-field-btn, .del-entry-btn, .save-entry-btn {
      padding: 6px 14px; border-radius: 8px; font-family: inherit;
      font-size: .8rem; font-weight: 600; cursor: pointer; border: 1.5px solid var(--line);
      background: var(--surface); color: var(--ink); transition: all .15s;
    }
    .add-field-btn:hover  { border-color: var(--blue); color: var(--blue); }
    .del-entry-btn        { color: var(--red); border-color: transparent; }
    .del-entry-btn:hover  { border-color: var(--red); background: rgba(214,48,49,.06); }
    .save-entry-btn       { background: var(--blue); color: #fff; border-color: var(--blue); margin-left: auto; }
    .save-entry-btn:hover { background: var(--blue-dark); }

    /* Add entry */
    .add-entry-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: 1.5px dashed var(--line);
      background: none; color: var(--muted); font-family: inherit; font-size: .9rem;
      cursor: pointer; margin-top: 4px; transition: all .15s;
    }
    .add-entry-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--bg-elevated); }

    /* Toast */
    .cred-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--bg); padding: 10px 20px;
      border-radius: 10px; font-size: .88rem; font-weight: 600;
      opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9999;
    }
    .cred-toast.show { opacity: 1; }

    /* Setup PIN */
    .setup-card {
      background: var(--surface); border: 1.5px solid var(--line);
      border-radius: 14px; padding: 28px; max-width: 400px; margin: auto;
    }
    .setup-card h2 { margin: 0 0 6px; font-size: 1.1rem; }
    .setup-card p  { margin: 0 0 18px; color: var(--muted); font-size: .88rem; }
    .setup-field { margin-bottom: 12px; }
    .setup-field label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
    .setup-field input {
      width: 100%; padding: 9px 12px; border-radius: 9px; border: 1.5px solid var(--line);
      background: var(--bg-elevated); color: var(--ink); font-family: inherit; font-size: .95rem;
      box-sizing: border-box; letter-spacing: .1em;
    }
    .setup-field input:focus { outline: none; border-color: var(--blue); }
    .setup-submit {
      width: 100%; padding: 10px; border-radius: 9px; border: none;
      background: var(--blue); color: #fff; font-family: inherit; font-weight: 700;
      font-size: .95rem; cursor: pointer; margin-top: 4px; transition: background .15s;
    }
    .setup-submit:hover { background: var(--blue-dark); }

    @keyframes shake { 0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)} }
  </style>
</head>
<body class="module-body">

  <header class="top">
    <div class="top-left">
      <button class="launcher-btn" id="launcherBtn" type="button" aria-label="Open app launcher">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="0" y="0" width="6" height="6" rx="1.5" fill="currentColor"/>
          <rect x="10" y="0" width="6" height="6" rx="1.5" fill="currentColor"/>
          <rect x="0" y="10" width="6" height="6" rx="1.5" fill="currentColor"/>
          <rect x="10" y="10" width="6" height="6" rx="1.5" fill="currentColor"/>
        </svg>
      </button>
      <a class="brand" href="/" aria-label="OptiLens Local home">
        <strong>OptiLens Local</strong>
        <span class="top-sep">·</span>
        <span class="top-crumb">Credentials</span>
      </a>
    </div>
    <div class="top-center">
      <button class="back-btn" type="button" aria-label="Go back" onclick="history.back()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="search-bar" id="searchTrigger" type="button" aria-label="Search (Ctrl+K)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M9 9l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="sb-text">Search modules, wiki, settings…</span>
        <kbd>Ctrl+K</kbd>
      </button>
    </div>
    <div class="top-right">
      <button class="top-action-btn" type="button" aria-label="Help">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 5.5a1.5 1.5 0 113 0c0 1-1.5 1.5-1.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7" cy="10.5" r=".75" fill="currentColor"/></svg>
      </button>
      <button class="top-action-btn theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">☽</button>
      <button class="user-chip" type="button" aria-label="User">
        <span class="user-avatar">RH</span>
        <span class="user-name">Russell H.</span>
      </button>
    </div>
  </header>

  <main class="module-main">
    <div class="creds-wrap">
      <div class="module-title" style="margin-bottom: 20px;">
        <div>
          <p class="eyebrow">Local LAN only</p>
          <h1>Credentials Vault</h1>
        </div>
        <span id="lockStatusBadge" class="badge">Locked</span>
      </div>

      <!-- Rendered by JS -->
      <div id="credsRoot"></div>
    </div>
  </main>

  <div class="cred-toast" id="credToast"></div>

  <script src="/shared.js"></script>
  <script src="/pwa.js"></script>
  <script>
  // ─── Crypto helpers ───────────────────────────────────────────────────────

  const ENC = new TextEncoder();
  const DEC = new TextDecoder();
  const SALT = "optilens-credentials-v1";

  async function deriveKey(pin) {
    const keyMat = await crypto.subtle.importKey(
      "raw", ENC.encode(pin), { name: "PBKDF2" }, false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: ENC.encode(SALT), iterations: 150000, hash: "SHA-256" },
      keyMat, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }

  async function hashPin(pin) {
    const buf = await crypto.subtle.digest("SHA-256", ENC.encode(pin + SALT));
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }

  async function encrypt(obj, key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv }, key, ENC.encode(JSON.stringify(obj)));
    return {
      iv: btoa(String.fromCharCode(...iv)),
      d:  btoa(String.fromCharCode(...new Uint8Array(cipher)))
    };
  }

  async function decrypt(blob, key) {
    const iv   = Uint8Array.from(atob(blob.iv), c => c.charCodeAt(0));
    const data = Uint8Array.from(atob(blob.d),  c => c.charCodeAt(0));
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
    return JSON.parse(DEC.decode(plain));
  }

  // ─── Storage keys ─────────────────────────────────────────────────────────

  const K_PIN  = "optilens.creds.pin";   // stored SHA-256 hash
  const K_DATA = "optilens.creds.data";  // encrypted JSON blob

  // ─── In-memory session ────────────────────────────────────────────────────

  let sessionKey  = null;   // CryptoKey when unlocked
  let vaultData   = null;   // decrypted object when unlocked

  const DEFAULT_CATEGORIES = ["SQL Server", "PSQL", "ODBC", "Access DB", "API Keys", "Other"];

  function blankVault() {
    return DEFAULT_CATEGORIES.reduce((o, cat) => { o[cat] = []; return o; }, {});
  }

  // ─── Toast ────────────────────────────────────────────────────────────────

  let toastTimer;
  function toast(msg) {
    const el = document.getElementById("credToast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }

  // ─── Render ───────────────────────────────────────────────────────────────

  const root = document.getElementById("credsRoot");
  const badge = document.getElementById("lockStatusBadge");

  function render() {
    const pinSet = !!localStorage.getItem(K_PIN);

    if (!pinSet) {
      renderSetup();
    } else if (!sessionKey) {
      renderLockScreen();
    } else {
      renderVault();
    }

    badge.textContent = sessionKey ? "Unlocked" : "Locked";
    badge.style.background = sessionKey ? "var(--badge-ok-bg)" : "var(--badge-warn-bg)";
    badge.style.color = sessionKey ? "#065f46" : "#92400e";
  }

  // ── Setup PIN ──
  function renderSetup() {
    root.innerHTML = `
      <div class="lock-screen">
        <div class="lock-icon">🔐</div>
        <div class="setup-card">
          <h2>Set up your credentials vault</h2>
          <p>Choose a passcode to protect stored connection strings and API keys. This is stored locally on this machine only.</p>
          <div class="setup-field">
            <label>Passcode (4–32 characters)</label>
            <input id="setupPin1" type="password" placeholder="New passcode" autocomplete="new-password">
          </div>
          <div class="setup-field">
            <label>Confirm passcode</label>
            <input id="setupPin2" type="password" placeholder="Confirm passcode" autocomplete="new-password">
          </div>
          <p id="setupErr" class="pin-err"></p>
          <button class="setup-submit" id="setupBtn">Create vault</button>
        </div>
      </div>`;

    document.getElementById("setupBtn").addEventListener("click", async () => {
      const p1 = document.getElementById("setupPin1").value;
      const p2 = document.getElementById("setupPin2").value;
      const errEl = document.getElementById("setupErr");
      if (p1.length < 4) { errEl.textContent = "Passcode must be at least 4 characters."; return; }
      if (p1 !== p2)     { errEl.textContent = "Passcodes do not match."; return; }
      errEl.textContent = "";
      const hash = await hashPin(p1);
      const key  = await deriveKey(p1);
      const data = blankVault();
      const blob = await encrypt(data, key);
      localStorage.setItem(K_PIN, hash);
      localStorage.setItem(K_DATA, JSON.stringify(blob));
      sessionKey = key;
      vaultData  = data;
      toast("Vault created ✓");
      render();
    });
  }

  // ── Lock screen ──
  function renderLockScreen() {
    root.innerHTML = `
      <div class="lock-screen">
        <div class="lock-icon">🔒</div>
        <h2 class="lock-title">Vault is locked</h2>
        <p class="lock-sub">Enter your passcode to access stored connection credentials.</p>
        <div class="pin-form">
          <div class="pin-input-row">
            <input class="pin-input" id="pinInput" type="password"
              placeholder="Passcode" autocomplete="current-password" autofocus>
            <button class="pin-btn" id="unlockBtn">Unlock</button>
          </div>
          <p id="pinErr" class="pin-err"></p>
          <p class="pin-hint">Credentials are encrypted with AES-256 and stored locally.</p>
        </div>
        <div style="margin-top:28px; display:flex; gap:12px;">
          <button class="add-field-btn" id="resetVaultBtn" style="color:var(--red); border-color: transparent; font-size:.78rem;">
            Forgot passcode? Reset vault (deletes all entries)
          </button>
        </div>
      </div>`;

    const input = document.getElementById("pinInput");
    const errEl = document.getElementById("pinErr");

    async function tryUnlock() {
      const pin = input.value;
      if (!pin) return;
      try {
        const storedHash = localStorage.getItem(K_PIN);
        const inputHash  = await hashPin(pin);
        if (inputHash !== storedHash) throw new Error("Wrong passcode");
        const key  = await deriveKey(pin);
        const blob = JSON.parse(localStorage.getItem(K_DATA) || "null");
        if (!blob) throw new Error("No vault data");
        vaultData  = await decrypt(blob, key);
        sessionKey = key;
        errEl.textContent = "";
        toast("Vault unlocked");
        render();
      } catch {
        errEl.textContent = "Incorrect passcode. Try again.";
        input.classList.add("error");
        input.value = "";
        setTimeout(() => input.classList.remove("error"), 500);
      }
    }

    document.getElementById("unlockBtn").addEventListener("click", tryUnlock);
    input.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });

    document.getElementById("resetVaultBtn").addEventListener("click", () => {
      if (!confirm("This will permanently delete all stored credentials. Are you sure?")) return;
      localStorage.removeItem(K_PIN);
      localStorage.removeItem(K_DATA);
      sessionKey = null;
      vaultData  = null;
      toast("Vault reset. Set a new passcode to continue.");
      render();
    });
  }

  // ── Vault (unlocked) ──
  let activeCategory = DEFAULT_CATEGORIES[0];

  async function persist() {
    if (!sessionKey || !vaultData) return;
    const blob = await encrypt(vaultData, sessionKey);
    localStorage.setItem(K_DATA, JSON.stringify(blob));
  }

  function renderVault() {
    const catData = vaultData[activeCategory] || [];

    root.innerHTML = `
      <div class="vault-header">
        <span class="vault-status">Unlocked</span>
        <button class="lock-btn" id="lockNow">🔒 Lock vault</button>
      </div>
      <div class="cred-tabs" id="credTabs">
        ${DEFAULT_CATEGORIES.map(c => `
          <button class="cred-tab${c === activeCategory ? " active" : ""}"
            data-cat="${esc(c)}">${esc(c)}</button>`).join("")}
      </div>
      <div class="cred-list" id="credList"></div>
      <button class="add-entry-btn" id="addEntryBtn">+ Add entry</button>`;

    document.getElementById("lockNow").addEventListener("click", () => {
      sessionKey = null; vaultData = null;
      toast("Vault locked");
      render();
    });

    document.querySelectorAll(".cred-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.cat;
        renderVault();
      });
    });

    document.getElementById("addEntryBtn").addEventListener("click", () => {
      if (!vaultData[activeCategory]) vaultData[activeCategory] = [];
      vaultData[activeCategory].push({ name: "New entry", type: activeCategory, fields: [{ label: "Value", val: "", secret: true }] });
      persist();
      renderVault();
      // open the last entry
      const entries = document.querySelectorAll(".cred-entry");
      entries[entries.length - 1]?.classList.add("open");
    });

    renderCredList(catData);
  }

  function renderCredList(entries) {
    const list = document.getElementById("credList");
    if (!entries.length) {
      list.innerHTML = `<div class="placeholder-pane" style="margin-bottom:0;">No entries yet for ${esc(activeCategory)}. Click "+ Add entry" below.</div>`;
      return;
    }

    list.innerHTML = entries.map((entry, ei) => `
      <div class="cred-entry" data-idx="${ei}">
        <div class="cred-header">
          <span class="cred-type-badge">${esc(entry.type || activeCategory)}</span>
          <span class="cred-name" contenteditable="true" data-name-idx="${ei}">${esc(entry.name)}</span>
          <span class="cred-chevron">▶</span>
        </div>
        <div class="cred-body">
          <div class="field-grid" id="fieldGrid-${ei}">
            ${(entry.fields || []).map((f, fi) => renderFieldRow(ei, fi, f)).join("")}
          </div>
          <div class="cred-actions">
            <button class="add-field-btn" data-entry="${ei}">+ Field</button>
            <button class="del-entry-btn" data-entry="${ei}">Delete entry</button>
            <button class="save-entry-btn" data-entry="${ei}">Save</button>
          </div>
        </div>
      </div>`).join("");

    // Accordion
    list.querySelectorAll(".cred-header").forEach(hdr => {
      hdr.addEventListener("click", e => {
        if (e.target.hasAttribute("contenteditable")) return;
        hdr.closest(".cred-entry").classList.toggle("open");
      });
    });

    // Name edit
    list.querySelectorAll("[data-name-idx]").forEach(el => {
      el.addEventListener("blur", () => {
        const idx = +el.dataset.nameIdx;
        vaultData[activeCategory][idx].name = el.textContent.trim() || "Untitled";
      });
    });

    // Add field
    list.querySelectorAll(".add-field-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = +btn.dataset.entry;
        vaultData[activeCategory][idx].fields.push({ label: "Field", val: "", secret: true });
        renderCredList(vaultData[activeCategory]);
        const entries = list.querySelectorAll(".cred-entry");
        entries[idx]?.classList.add("open");
      });
    });

    // Delete entry
    list.querySelectorAll(".del-entry-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const idx = +btn.dataset.entry;
        vaultData[activeCategory].splice(idx, 1);
        await persist();
        renderCredList(vaultData[activeCategory]);
        toast("Entry deleted");
      });
    });

    // Save entry
    list.querySelectorAll(".save-entry-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const idx = +btn.dataset.entry;
        // Collect fields from DOM
        const entry = vaultData[activeCategory][idx];
        const grid = document.getElementById(`fieldGrid-${idx}`);
        entry.fields = [];
        grid.querySelectorAll(".field-row").forEach(row => {
          const label  = row.querySelector(".field-label-input")?.value || "";
          const val    = row.querySelector(".field-val")?.value || "";
          const secret = row.querySelector(".field-secret")?.checked ?? true;
          entry.fields.push({ label, val, secret });
        });
        await persist();
        toast("Saved ✓");
      });
    });

    // Delete field
    list.querySelectorAll(".del-field-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const ei = +btn.dataset.entry;
        const fi = +btn.dataset.field;
        vaultData[activeCategory][ei].fields.splice(fi, 1);
        renderCredList(vaultData[activeCategory]);
        list.querySelectorAll(".cred-entry")[ei]?.classList.add("open");
      });
    });

    // Reveal toggle
    list.querySelectorAll(".reveal-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = btn.previousElementSibling;
        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        btn.textContent = hidden ? "🙈" : "👁";
      });
    });
  }

  function renderFieldRow(ei, fi, f) {
    const isSecret = f.secret !== false;
    return `
      <div class="field-row">
        <input class="field-label-input" value="${esc(f.label)}"
          style="padding:6px 8px; border-radius:7px; border:1.5px solid var(--line);
          background:var(--bg-elevated); color:var(--muted); font-family:inherit;
          font-size:.78rem; font-weight:600; width:100%; box-sizing:border-box;">
        <div class="field-val-wrap">
          <input class="field-val" type="${isSecret ? "password" : "text"}"
            value="${esc(f.val)}" placeholder="value">
          <button class="reveal-btn" title="${isSecret ? "Show" : "Hide"}">${isSecret ? "👁" : "🙈"}</button>
        </div>
        <div class="field-actions">
          <label style="display:flex;align-items:center;gap:3px;font-size:.72rem;color:var(--muted);cursor:pointer">
            <input class="field-secret" type="checkbox" ${isSecret ? "checked" : ""}>secret
          </label>
          <button class="del-field-btn" data-entry="${ei}" data-field="${fi}" title="Remove field">✕</button>
        </div>
      </div>`;
  }

  function esc(v) {
    return String(v)
      .replaceAll("&","&amp;").replaceAll("<","&lt;")
      .replaceAll(">","&gt;").replaceAll('"',"&quot;");
  }

  // ─── Seed default templates on first unlock for known categories ──────────

  function seedDefaultFields(vault) {
    const templates = {
      "SQL Server": [
        { name: "Innovations MSSQL",    type: "SQL Server", fields: [
          { label:"Server",   val:"", secret:false },
          { label:"Database", val:"", secret:false },
          { label:"Username", val:"", secret:false },
          { label:"Password", val:"", secret:true  }
        ]},
        { name: "App DB (SQLite path)", type: "SQL Server", fields: [
          { label:"Path", val:"", secret:false }
        ]}
      ],
      "PSQL": [
        { name: "Innovations PSQL", type: "PSQL", fields: [
          { label:"Host",     val:"", secret:false },
          { label:"Port",     val:"5432", secret:false },
          { label:"Database", val:"", secret:false },
          { label:"Username", val:"", secret:false },
          { label:"Password", val:"", secret:true  }
        ]}
      ],
      "ODBC": [
        { name: "Primary DSN", type: "ODBC", fields: [
          { label:"DSN Name", val:"", secret:false },
          { label:"Username", val:"", secret:false },
          { label:"Password", val:"", secret:true  }
        ]}
      ],
      "Access DB": [
        { name: "CV_Accounts_be", type: "Access DB", fields: [
          { label:"File path", val:"", secret:false }
        ]}
      ],
      "API Keys": [
        { name: "Website API", type: "API Keys", fields: [
          { label:"Base URL", val:"", secret:false },
          { label:"API Key",  val:"", secret:true  }
        ]}
      ]
    };
    let seeded = false;
    for (const [cat, entries] of Object.entries(templates)) {
      if (vault[cat] && vault[cat].length === 0) {
        vault[cat] = entries;
        seeded = true;
      }
    }
    return seeded;
  }

  // ─── Init ─────────────────────────────────────────────────────────────────

  render();

  // Hook into unlock to seed defaults
  const origRender = render;
  const origSetSessionKey = () => {};

  // Watch for unlock event via MutationObserver on badge text
  const obs = new MutationObserver(() => {
    if (sessionKey && vaultData) {
      const seeded = seedDefaultFields(vaultData);
      if (seeded) persist();
    }
  });
  obs.observe(document.getElementById("lockStatusBadge"), { childList: true, characterData: true, subtree: true });
  </script>
</body>
</html>
