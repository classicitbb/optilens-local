<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1E35">
  <title>Business Metrics - OptiLens Local</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/optilens.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/styles/pages/business-metrics.css">
</head>
<body class="module-body">

  <div id="app-shell-header"></div>
<script>
  window.OptiLensPage = {
    crumb: "Business Metrics"
  };
</script>


  <main class="module-main">
    <section class="module-workspace">
      <div class="module-title">
        <div>
          <p class="eyebrow">Reporting &amp; KPIs</p>
          <h1>Business Metrics</h1>
        </div>
        <span class="badge planned" id="statusBadge">Loading…</span>
      </div>

      <nav class="workflow-tabs" aria-label="Metrics tabs">
        <button class="active" type="button" data-tab="overview">Overview</button>
        <button type="button" data-tab="sales">Sales</button>
        <button type="button" data-tab="invoices">Invoices</button>
        <button type="button" data-tab="profitability">Profitability</button>
        <button type="button" data-tab="deliveries">Deliveries</button>
        <button type="button" data-tab="pricing">Pricing</button>
      </nav>

      <!-- Every panel is rendered by a module and loads its own data on first open:
           Overview   → business-metrics-overview.js  → /api/business-metrics/summary
           Tabs 2-6   → business-metrics-tabs.js      → /api/business-metrics/detail/:section
           Both share the drawer and refresh kit in business-metrics-shared.js. -->
      <section class="workflow-panel active" id="overview"><div class="ov-root" id="ovRoot"></div></section>
      <section class="workflow-panel" id="sales"><div class="ov-root" data-section="sales"></div></section>
      <section class="workflow-panel" id="invoices"><div class="ov-root" data-section="invoices"></div></section>
      <section class="workflow-panel" id="profitability"><div class="ov-root" data-section="profitability"></div></section>
      <section class="workflow-panel" id="deliveries"><div class="ov-root" data-section="deliveries"></div></section>
      <section class="workflow-panel" id="pricing"><div class="ov-root" data-section="pricing"></div></section>
    </section>
  </main>

  <script src="/shared.js"></script>
  <script src="/pwa.js"></script>
  <script src="/business-metrics-shared.js"></script>
  <script src="/business-metrics-overview.js"></script>
  <script src="/business-metrics-tabs.js"></script>
</body>
</html>
