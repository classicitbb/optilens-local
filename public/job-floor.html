<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-visual: the on-screen keyboard overlays the page instead of reflowing it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="theme-color" content="#0B1E35">
  <title>Status Update - OptiLens Local</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/optilens.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/styles/pages/job-floor.css">
  <link rel="stylesheet" href="/styles/system.css">
</head>
<body class="module-body job-floor-page">

  <div id="app-shell-header"></div>
<script>
  window.OptiLensPage = {
    crumb: "Status Update",
    assistant: false,
    headerTools: false,
    search: false
  };
</script>

  <main class="module-main">
    <section class="jf-screen" aria-label="Status Update">

      <div class="jf-result-bar">
        <span class="jf-icon" id="jfIcon" aria-hidden="true"></span>
        <h2>Result</h2>
      </div>
      <ul class="jf-log" id="jfLog" aria-live="polite" aria-label="Result"></ul>

      <form id="jfStatusForm" class="jf-fields" autocomplete="off">
        <label class="jf-field" for="jfStatusItem">Status:</label>
        <select id="jfStatusItem" class="jf-control" required><option value="">Loading…</option></select>

        <label class="jf-field jf-field-key" for="jfStatusValue">Tray ID:</label>
        <input id="jfStatusValue" class="jf-control" required enterkeyhint="done"
               autocapitalize="off" autocorrect="off" spellcheck="false">
      </form>
    </section>
  </main>

  <script src="/shared.js"></script>
  <script src="/pwa.js"></script>
  <script src="/job-floor.js"></script>
</body>
</html>
