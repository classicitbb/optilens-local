<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OptiLens Internal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark">OL</div>
        <div>
          <strong>OptiLens</strong>
          <span>Internal</span>
        </div>
      </div>
      <nav class="nav-list">
        <button class="nav-item active" type="button" data-view="dashboard">Dashboard</button>
        <button class="nav-item" type="button" data-view="orders">Orders</button>
        <button class="nav-item" type="button" data-view="patients">Patients</button>
        <button class="nav-item" type="button" data-view="inventory">Inventory</button>
      </nav>
      <div class="sidebar-foot">
        <span>Location</span>
        <strong>Halifax Clinic</strong>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">Today</p>
          <h1>Practice operations</h1>
        </div>
        <div class="top-actions">
          <label class="search">
            <span>Search</span>
            <input id="globalSearch" type="search" placeholder="Patient, order, frame...">
          </label>
          <button class="primary-action" id="newOrderBtn" type="button">New Order</button>
        </div>
      </header>

      <section class="view active" id="dashboard" aria-label="Dashboard">
        <div class="metric-grid">
          <article class="metric">
            <span>Open orders</span>
            <strong id="openOrdersCount">0</strong>
          </article>
          <article class="metric">
            <span>Ready pickup</span>
            <strong id="readyOrdersCount">0</strong>
          </article>
          <article class="metric">
            <span>Low stock</span>
            <strong id="lowStockCount">0</strong>
          </article>
          <article class="metric">
            <span>Due today</span>
            <strong id="dueTodayCount">0</strong>
          </article>
        </div>

        <div class="content-grid">
          <section class="panel">
            <div class="panel-head">
              <h2>Order queue</h2>
              <button class="ghost" type="button" data-view-link="orders">View all</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Order</th>
                    <th>Patient</th>
                    <th>Status</th>
                    <th>Due</th>
                  </tr>
                </thead>
                <tbody id="dashboardOrders"></tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Low inventory</h2>
              <button class="ghost" type="button" data-view-link="inventory">Review</button>
            </div>
            <div id="lowInventoryList" class="stack-list"></div>
          </section>
        </div>
      </section>

      <section class="view" id="orders" aria-label="Orders">
        <div class="panel">
          <div class="panel-head">
            <h2>Orders</h2>
            <div class="segmented" role="group" aria-label="Filter orders">
              <button class="segment active" type="button" data-filter="all">All</button>
              <button class="segment" type="button" data-filter="In lab">In lab</button>
              <button class="segment" type="button" data-filter="Ready">Ready</button>
              <button class="segment" type="button" data-filter="Waiting">Waiting</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Patient</th>
                  <th>Frame</th>
                  <th>Lens</th>
                  <th>Status</th>
                  <th>Due</th>
                </tr>
              </thead>
              <tbody id="ordersTable"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="view" id="patients" aria-label="Patients">
        <div class="patient-grid" id="patientsGrid"></div>
      </section>

      <section class="view" id="inventory" aria-label="Inventory">
        <div class="panel">
          <div class="panel-head">
            <h2>Inventory</h2>
            <button class="ghost" id="resetDataBtn" type="button">Reset Sample Data</button>
          </div>
          <div class="inventory-grid" id="inventoryGrid"></div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="orderDialog">
    <form method="dialog" id="orderForm" class="order-form">
      <div class="panel-head">
        <h2>New order</h2>
        <button class="icon-button" value="cancel" aria-label="Close" type="submit">x</button>
      </div>
      <label>
        Patient name
        <input name="patient" required autocomplete="off">
      </label>
      <label>
        Frame
        <input name="frame" required autocomplete="off">
      </label>
      <label>
        Lens type
        <select name="lens" required>
          <option value="Single vision">Single vision</option>
          <option value="Progressive">Progressive</option>
          <option value="Bifocal">Bifocal</option>
          <option value="Computer">Computer</option>
        </select>
      </label>
      <label>
        Due date
        <input name="due" type="date" required>
      </label>
      <menu>
        <button class="ghost" value="cancel" type="submit">Cancel</button>
        <button class="primary-action" value="default" type="submit">Create</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
