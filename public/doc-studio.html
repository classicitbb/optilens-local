<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1E35">
  <title>Doc Studio - OptiLens Local</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/optilens.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">

    body.module-body { display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  <div id="app-shell-header"></div>
<script>

  };
</script>


  <main class="module-main">
    <iframe
      class="ds-frame"
      src="/ds/studio.html?embedded=1"
      title="Doc Studio"
      allow="clipboard-write"
    ></iframe>
  </main>

  <script src="/shared.js"></script>
  <script src="/pwa.js"></script>

</html>
