<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1E35">
  <title>Users | OptiLens Local</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/optilens.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="module-body">
  <div id="app-shell-header"></div>
<script>
  window.OptiLensPage = {
    crumb: "Users"
  };
</script>


  <main class="module-main">
    <section class="module-workspace">
      <div class="module-title">
        <div>
          <p class="eyebrow">Platform admin</p>
          <h1>Users</h1>
        </div>
      </div>

      <div class="workflow-panel active">
        <div class="admin-grid">
          <form class="admin-panel" id="userForm">
            <div class="admin-panel-head">
              <h2>Create User</h2>
            </div>
            <div class="admin-panel-body">
              <label>Username
                <input id="newUsername" autocomplete="off" required>
              </label>
              <label>Display name
                <input id="newDisplayName" autocomplete="name" required>
              </label>
              <label>Email
                <input id="newEmail" type="email" autocomplete="email">
              </label>
              <label>Temporary password
                <input id="newPassword" type="password" autocomplete="new-password" required>
              </label>
              <div>
                <p class="eyebrow">Roles</p>
                <div class="checkbox-grid" id="roleChoices"></div>
              </div>
              <div class="admin-message" id="userFormMessage"></div>
              <button class="button primary" type="submit">Create user</button>
            </div>
          </form>

          <form class="admin-panel" id="roleForm">
            <div class="admin-panel-head">
              <h2>Role Templates</h2>
            </div>
            <div class="admin-panel-body">
              <label>Role name
                <input id="newRoleName" autocomplete="off" required>
              </label>
              <label>Role code
                <input id="newRoleCode" autocomplete="off" placeholder="shipping">
              </label>
              <div>
                <p class="eyebrow">Default module access</p>
                <div class="module-access-grid" id="newRoleModuleAccess"></div>
              </div>
              <div class="admin-message" id="roleFormMessage"></div>
              <button class="button primary" type="submit">Create role</button>
            </div>
          </form>

          <section class="admin-panel">
            <div class="admin-panel-head">
              <h2>Active Accounts</h2>
            </div>
            <div class="admin-panel-body">
              <div class="admin-message" id="userListMessage">Loading users...</div>
              <div class="user-list" id="userList"></div>
            </div>
          </section>

          <section class="admin-panel admin-panel-wide">
            <div class="admin-panel-head">
              <h2>Role Access</h2>
            </div>
            <div class="admin-panel-body">
              <div class="admin-message" id="roleListMessage"></div>
              <div class="role-list" id="roleList"></div>
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <script src="/shared.js"></script>
  <script src="/admin-users.js"></script>
</body>
</html>
